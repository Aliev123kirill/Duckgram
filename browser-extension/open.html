<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Открыть в приложении?</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0a0a0a;
      color: #e8e8e8;
      font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background:
        radial-gradient(680px 400px at 50% -10%, rgba(255, 255, 255, 0.08), transparent 70%),
        #0a0a0a;
    }
    .card {
      width: 100%;
      max-width: 460px;
      padding: 36px 32px 28px;
      border: 1px solid #1e1e1e;
      border-radius: 22px;
      background: linear-gradient(180deg, #141414, #0e0e0e);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      text-align: center;
    }
    .duck {
      width: 76px;
      height: 76px;
      border-radius: 20px;
      display: block;
      margin: 0 auto 20px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 21px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }
    .lead {
      margin: 0 0 18px;
      color: #a2a2a2;
      font-size: 14.5px;
    }
    .target {
      display: block;
      margin: 0 0 26px;
      padding: 12px 14px;
      border: 1px solid #202020;
      border-radius: 12px;
      background: #101010;
      color: #d0d0d0;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: 13px;
      word-break: break-all;
    }
    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 13px 26px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.05s ease;
    }
    button:active { transform: translateY(1px); }
    .primary { color: #0a0a0a; background: #ededed; }
    .primary:hover { background: #ffffff; }
    .ghost { color: #c8c8c8; background: #1a1a1a; border: 1px solid #262626; }
    .ghost:hover { background: #202020; }
    .hint {
      margin: 22px 0 0;
      color: #7c7c7c;
      font-size: 12.5px;
    }
    .hint code {
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      color: #b0b0b0;
      background: #191919;
      padding: 1px 5px;
      border-radius: 5px;
    }
    .stopped {
      margin: 0;
      color: #9a9a9a;
      font-size: 13.5px;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="duck" src="icons/icon128.png" alt="">
    <h1>Открыть в приложении?</h1>
    <p class="lead">Эта ссылка ведёт в Telegram. Её можно открыть сразу в приложении, без загрузки страницы в браузере.</p>
    <code class="target" id="target">t.me</code>

    <div class="actions" id="actions">
      <button class="primary" id="open" type="button">Открыть в приложении</button>
      <button class="ghost" id="skip" type="button">Не открывать</button>
    </div>

    <p class="hint" id="hint">Если приложение не запустилось, в системе не назначен обработчик <code>tg://</code>.</p>
  </main>
  <script src="open.js"></script>
</body>
</html>
